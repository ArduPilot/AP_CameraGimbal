<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2733"/>
      <stop offset="100%" stop-color="#0d151d"/>
    </linearGradient>
    <linearGradient id="mapFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f4a5e"/>
      <stop offset="100%" stop-color="#233a4a"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#f5821f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile background -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#39505f" stroke-width="2"/>

  <!-- Map panel -->
  <g filter="url(#soft)">
    <rect x="70" y="250" width="372" height="200" rx="20" fill="url(#mapFill)"/>
    <!-- map fold lines -->
    <line x1="194" y1="250" x2="194" y2="450" stroke="#1c2e3a" stroke-width="3"/>
    <line x1="318" y1="250" x2="318" y2="450" stroke="#1c2e3a" stroke-width="3"/>
    <!-- contour/terrain squiggles -->
    <path d="M90 300 q20 -14 40 0 t40 0 t40 0" stroke="#3d5a6e" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M90 420 q24 14 48 0 t48 0 t48 0 t48 0" stroke="#3d5a6e" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- flight path -->
    <path d="M110 400 C 170 320, 230 420, 290 340 S 400 300, 420 280" fill="none" stroke="#f5821f" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>
    <!-- start point -->
    <circle cx="110" cy="400" r="8" fill="#7fd858"/>
    <!-- location pin at end of path -->
    <g transform="translate(420, 280)">
      <path d="M0 -34 C 18 -34 30 -21 30 -6 C 30 16 0 40 0 40 C 0 40 -30 16 -30 -6 C -30 -21 -18 -34 0 -34 Z" fill="#e94b3c" stroke="#3a0f0a" stroke-width="2"/>
      <circle cx="0" cy="-6" r="10" fill="#ffffff"/>
    </g>
  </g>

  <!-- Camera body -->
  <g filter="url(#soft)">
    <rect x="118" y="112" width="220" height="150" rx="24" fill="#eef2f5"/>
    <!-- viewfinder bump -->
    <rect x="150" y="90" width="70" height="34" rx="10" fill="#eef2f5"/>
    <!-- record light -->
    <circle cx="330" cy="132" r="9" fill="#e94b3c"/>
    <!-- lens -->
    <circle cx="200" cy="190" r="58" fill="#12202b"/>
    <circle cx="200" cy="190" r="46" fill="url(#lensGrad)"/>
    <circle cx="200" cy="190" r="46" fill="none" stroke="#7a3d05" stroke-width="2" opacity="0.4"/>
    <circle cx="184" cy="174" r="12" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
