# Raspberry Pi + IMX477 + CADDX gimbal defaults; install as /etc/ap_cameragimbal/camera.ini.
[general]
timezone = GMT
[mount]
orientation = upright
[uart]
# MAVLink arrives through the local MAVLink router (for example Rpanion-server).
protocol = none
[mavlink]
# 0 waits for a flight-controller heartbeat to adopt its ID.
system_id = 0
camera_component_id = 100
position_targeting = false
# Add a mavlink-router UDP client endpoint to 127.0.0.1:14570. Port 14550 is
# left free for the router's own GCS endpoint. The web interface sends its
# camera controls to the TCP port.
tcp_port = 14570
udp_port = 14570
[recording]
autorecord = false
resolution = 1920x1080
[stream.main]
resolution = 1920x1080
codec = h264
# optional extra RTSP path names for /video1 and /video2
alias = ""
[stream.sub]
# Duplicates the main stream; the Pi 4 / CM4 has a single 1080p30 encoder.
resolution = 1920x1080
codec = h264
alias = ""
[image]
brightness = 50
saturation = 50
contrast = 50
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

# The host OS owns networking on the Pi; these settings are ignored.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
capture = false
