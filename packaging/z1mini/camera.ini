# XFRobot Z1-Mini overlay defaults; preserved across updates in /opt/ap_cameragimbal.
[general]
timezone = UTC0
[mount]
orientation = upright
[uart]
# External flight-controller UART pinout is not verified. MAVLink uses Ethernet.
protocol = none
[mavlink]
# 1 works on a bench; 0 waits for a flight-controller heartbeat to adopt its ID.
system_id = 0
camera_component_id = 100
position_targeting = false
tcp_port = 14550
udp_port = 14550
[recording]
autorecord = false
resolution = 1920x1080
[stream.main]
resolution = 1920x1080
codec = h264
[stream.sub]
# First overlay duplicates the main stream; no second encoder is allocated.
resolution = 1920x1080
codec = h264
