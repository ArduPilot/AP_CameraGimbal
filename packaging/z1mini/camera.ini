# XFRobot Z1-Mini overlay defaults; preserved across updates in /opt/ap_cameragimbal.
[general]
timezone = GMT
[mount]
orientation = upright
[uart]
# External flight-controller UART pinout is not verified. MAVLink uses Ethernet.
protocol = none
[mavlink]
# Geographic ROI tracking; explicit angle/rate commands are unchanged.
tracking_method = rate
# 1 works on a bench; 0 waits for a flight-controller heartbeat to adopt its ID.
system_id = 0
camera_component_id = 100
position_targeting = false
tcp_port = 16001
udp_port = 16001
[recording]
autorecord = false
resolution = 1920x1080
[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
resolution = 1920x1080
codec = h264
# optional extra RTSP path names for /video1 and /video2
alias = ""
[stream.sub]
# First overlay duplicates the main stream; no second encoder is allocated.
resolution = 1920x1080
codec = h264
alias = ""

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false

# Copies photos and recordings to your Google Drive or Dropbox,
# while the vehicle is not armed (the file being recorded is sent after the
# recording ends). See docs/cloud-upload-setup.md for creating the credentials. These apply
# without a restart.
[upload]
enable = false
# gdrive (Google Drive) or dropbox
service = gdrive
# Folder in your cloud account, for example AP_CameraGimbal (created if needed; no
# colon, and it may contain subfolders such as Camera/Pics). For Dropbox it is
# inside the app's folder. Photos go to <folder>/photos and recordings to
# <folder>/recordings.
folder = ""
# photos, recordings or both
what = both
# keep local copies, delete them once uploaded, or (delete_when_low) delete
# every file uploaded by a check that starts with free space below
# low_space_percent
after_upload = keep
low_space_percent = 20
# Upload speed limit in KiB/s (kibibytes per second), 0 for no limit
bandwidth_kib_s = 0
# Minutes between looks for new files while idle
scan_minutes = 5
