# ZR10 initial hardware-test defaults. Settings are preserved on the SD card.
[general]
timezone = GMT
[capture]
photo_scope = all
[mount]
# Mounting transforms need hardware validation; start with upright.
orientation = upright
[uart]
# Linux UART transport only; the external connector is assumed MCU-owned,
# like A8 and MT11. This does not select or disable its protocol.
protocol = none
[mavlink]
# Geographic ROI tracking; explicit angle/rate commands are unchanged.
tracking_method = rate
system_id = 0
position_targeting = true
tcp_port = 16001
udp_port = 16001
[thermal]
palette = white_hot
[recording]
autorecord = false
resolution = 2560x1440
[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# 1280x720, 1920x1080 and 2560x1440. Three encoders share the hardware budget.
resolution = 1280x720
codec = h264
# extra RTSP path for the same stream; the vendor firmware serves main.264
alias = "main.264"
[stream.sub]
resolution = 1280x720
codec = h264
alias = ""
[image]
# Factory IQ retained; manual overrides are not yet implemented.
brightness = 50
saturation = 50
contrast = 50
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

[support_proxy]
enabled = false
host = ""
mavlink_port = 10001
signing = false
signing_passphrase = ""
signing_link_id = 1
# Set session-assigned ports to enable video publishing; 0 disables.
video1_port = 0
video1_name = "video1"
video2_port = 0
video2_name = "video2"
publish_password = ""

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false

# Copies photos and recordings to your Google Drive or Dropbox,
# while the vehicle is not armed (the file being recorded is sent after the
# recording ends). See docs/cloud-upload-setup.md for creating the credentials. These apply
# without a restart.
[upload]
enable = false
# gdrive (Google Drive) or dropbox
service = gdrive
# Folder in your cloud account, for example AP_CameraGimbal (created if needed; no
# colon, and it may contain subfolders such as Camera/Pics). For Dropbox it is
# inside the app's folder. Photos go to <folder>/photos and recordings to
# <folder>/recordings.
folder = ""
# photos, recordings or both
what = both
# keep local copies, delete them once uploaded, or (delete_when_low) delete
# every file uploaded by a check that starts with free space below
# low_space_percent
after_upload = keep
low_space_percent = 20
# Upload speed limit in KiB/s (kibibytes per second), 0 for no limit
bandwidth_kib_s = 0
# Minutes between looks for new files while idle
scan_minutes = 5
