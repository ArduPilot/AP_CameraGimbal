# camera-app configuration
#
# SIYI ZT30 defaults, installed as /customer/camera-app/camera.ini on
# first boot and then preserved across application updates.

[general]
# Built-in IANA name (see timezones/zones.txt). GMT is UTC+0.
timezone = GMT

[capture]
# Three lenses; all saves wide, zoom and thermal photographs.
photo_scope = all

[mount]
# auto follows the mounting direction reported by the gimbal controller.
# upright and inverted force a mounting direction.
orientation = auto

[uart]
# Linux UART transport only (none, siyi or mavlink).
# External UART ownership/forwarding needs bench testing; no Linux UART
# is exposed by the initial ZT30 target.
protocol = none

[mavlink]
# Geographic ROI tracking; explicit angle/rate commands are unchanged.
tracking_method = rate
# 0 adopts the first flight controller heartbeat system ID; 1..255 fixes it.
system_id = 0
camera_component_id = 100
# MAVLink 2 camera and gimbal-device services listen on both transports.
# TCP and UDP may use the same numeric port. Set either one to 0 to disable it.
# Advertise and handle geographic ROI targets in the camera when true.
position_targeting = true
tcp_port = 16001
udp_port = 16001

[thermal]
# Thermal FOV/radiometry need native qualification.
# white_hot, sepia, ironbow, rainbow, night, aurora, red_hot, jungle,
# medical, black_hot or glory_hot
palette = white_hot

[recording]
# false: manual, true: start at app startup, while_armed: follow MAVLink arming
autorecord = false
resolution = 3840x2160

[video]
# misb (default): .misb RTSP and .ts recordings; apcg: JSON SEI and MP4.
# Applies after restarting camera-app. MAVLink parameter: VIDEO_META_FMT.
telemetry = misb

[stream.main]
# rtsp://CAMERA:8554/video1
resolution = 1280x720
codec = h264
# RGB stream kbps, 500-12000; applies after restarting camera-app. Parameter VIDEO_MAIN_KBPS.
bitrate_kbps = 1570
# extra RTSP path for the same stream; the vendor firmware serves main.264
alias = ""

[stream.sub]
# rtsp://CAMERA:8554/video2
resolution = 1280x720
codec = h264
alias = ""

[image]
# Applied through the SigmaStar ISP after the tuning file loads.
brightness = 50
saturation = 50
contrast = 50
# Tenths of an EV, from -10 (-1 EV) through 10 (+1 EV).
exposure_compensation = 0
iso = auto
shutter = auto
metering = average
white_balance = auto

# Optional ArduPilot SupportProxy relay; settings apply on app restart.
[support_proxy]
enabled = false
host = ""
mavlink_port = 10001
signing = false
signing_passphrase = ""
signing_link_id = 1
# Set session-assigned ports to enable video publishing; 0 disables.
video1_port = 0
video1_name = "video1"
video2_port = 0
video2_name = "video2"
# Lossless raw thermal (Matroska); needs its own proxy video port.
video3_port = 0
video3_name = "Raw Thermal (16-bit)"
publish_password = ""

# Address settings apply on camera-app restart. Blank primary leaves current addresses in place.
# An explicit primary replaces the interface's IPv4 addresses; IPv6 is unchanged.
[network]
# Optional VPN: enable and save to join this ZeroTier network.
vpn_enabled=false
vpn_provider=zerotier
vpn_network_id=

interface = eth0
primary_address = ""
secondary_address = ""
gateway = ""
# Live packet capture, off by default; four 16 MiB PCAP files in DCIM/network.
capture = false

# Copies photos and recordings to your Google Drive or Dropbox,
# while the vehicle is not armed (the file being recorded is sent after the
# recording ends). See docs/cloud-upload-setup.md for creating the credentials. These apply
# without a restart.
[upload]
enable = false
# gdrive (Google Drive) or dropbox
service = gdrive
# Folder in your cloud account, for example AP_CameraGimbal (created if needed; no
# colon, and it may contain subfolders such as Camera/Pics). For Dropbox it is
# inside the app's folder. Photos go to <folder>/photos and recordings to
# <folder>/recordings.
folder = ""
# photos, recordings or both
what = both
# keep local copies, delete them once uploaded, or (delete_when_low) delete
# every file uploaded by a check that starts with free space below
# low_space_percent
after_upload = keep
low_space_percent = 20
# Upload speed limit in KiB/s (kibibytes per second), 0 for no limit
bandwidth_kib_s = 0
# Minutes between looks for new files while idle
scan_minutes = 5
